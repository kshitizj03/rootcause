# Pin the observability backends to fixed host ports so snapshot capture and `rootcause status` can reach them
# (the agent's tools never do: they read only recorded snapshots).
# Layered on top of the upstream OpenTelemetry Demo compose files (which stay untouched). Bound to loopback: the demo
# runs OpenSearch with its security plugin off, so nothing else on the network should reach these ports.
services:
  jaeger:
    ports:
      - "127.0.0.1:16686:16686"
  opensearch:
    ports:
      - "127.0.0.1:9200:9200"
