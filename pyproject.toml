[build-system]
requires = ["setuptools>=77"]  # PEP 639 license expression
build-backend = "setuptools.build_meta"

[project]
name = "rootcause"
version = "0.1.0"
description = "An honest benchmark of LLM incident-diagnosis agents on recorded microservice incidents"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Kshitiz Jain" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Topic :: System :: Monitoring",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# requirements.txt has these plus pytest; requirements-lock.txt pins that tree and is what CI installs
dependencies = [
    "requests>=2.31",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "openai>=1.50",
    "mcp>=2.3",
    "matplotlib>=3.8",
    "opentelemetry-sdk>=1.45",
    "opentelemetry-exporter-otlp-proto-http>=1.45",
]

[project.urls]
Repository = "https://github.com/kshitizj03/rootcause"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
rootcause = "rootcause.cli:main"

[tool.setuptools]
packages = ["rootcause"]
