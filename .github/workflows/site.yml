name: site
# Publishes the site to GitHub Pages: the data release, then site/data built from it, then the web/ app built into web/dist. Pages needs a public repo
# on the free plan, so the job is skipped while the repository is private.
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - run: pip install -r requirements-lock.txt
      - run: python -m pytest -q   # never publish from a commit whose tests fail
      - run: python -m rootcause fetch-data   # the data release (release.TAG), checked against config.DATA_SHA256
      - run: python -m rootcause site
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm test   # includes the claims test, which reads site/data built above
        working-directory: web
      - run: npm run build
        working-directory: web
      - run: npm run check
        working-directory: web
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: web/dist
      - id: deploy
        uses: actions/deploy-pages@v4
