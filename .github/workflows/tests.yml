name: tests
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true
jobs:
  pytest:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]   # the documented workflow is Windows-first
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - run: pip install -r requirements-lock.txt   # pinned; pyproject.toml keeps the >= ranges
      - run: python -m pytest -q   # offline: no Docker, no API key, no recorded snapshots
      - uses: actions/setup-node@v5
        if: runner.os == 'Linux'   # the site's pure logic (site/assets/lib.js) is the same on every OS
        with:
          node-version: 22
      - run: node --test "site/tests/*.test.mjs"   # Node expands the glob
        if: runner.os == 'Linux'

  # The published numbers must follow from the released data and today's code.
  reproduce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - run: pip install -r requirements-lock.txt
      - run: python -m rootcause fetch-data   # the data release, checked against config.DATA_SHA256
      - name: The committed report is regenerated from the released run records
        run: python -m rootcause report && git diff --exit-code docs/results/report.md
      - name: Re-scoring the rule from the raw incidents matches its released records
        run: |
          python -m rootcause eval-custom rootcause.heuristic:solve --name heuristic-ci | tail -n +2 > rescored.txt
          python -m rootcause summary heuristic > released.txt
          diff rescored.txt released.txt
